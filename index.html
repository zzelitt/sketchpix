<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sketchpix</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="header-text">sketchpix</div>
    </div>

    <div class="main">
        <div id="modes">
            <button id="randomMode">Random Color Mode</button>
            <button id="normalMode">Normal Mode</button>
        </div>
        <div id="input">
            <form id="size_form">
                <input type="text" id="grid_size" placeholder="Enter grid size (16 - 100)">
                <button type="submit" id="grid_button">Reset Grid size</button>
            </form>
            <button id="clear_canvas">Clear Canvas</button>
        </div>
        <div id="canvas-container"></div>
    </div>
</body>
</html>
